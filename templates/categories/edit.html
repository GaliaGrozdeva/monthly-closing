{% extends 'base.html' %}
{% block title %}Редактиране · {{ category.name }}{% endblock %}
{% block content %}
<p class="breadcrumb"><a href="{{ category.get_absolute_url }}" data-shortcut="back" aria-keyshortcuts="Escape">← Към категорията <kbd>Esc</kbd></a></p>
<div class="page-heading narrow"><p class="eyebrow">Промяна на категория</p><h1>Редактирай категорията</h1></div>
<p class="form-new-link narrow"><a href="{% url 'categories:create' %}" data-shortcut="new" aria-keyshortcuts="F1">Нова категория <kbd>F1</kbd></a></p>
<form class="panel form-panel narrow" method="post" novalidate>{% csrf_token %}{% include 'includes/form_fields.html' %}<div class="actions"><button class="button" type="submit" data-shortcut="save" aria-keyshortcuts="F2">Запази промените <kbd>F2</kbd></button><a class="button secondary" href="{{ category.get_absolute_url }}">Отказ <kbd>Esc</kbd></a></div></form>
{% endblock %}
